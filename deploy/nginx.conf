server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Фронтенд и api видны браузеру на одном origin: страницам не нужен CORS,
    # а адрес api не попадает в сборку.
    location /api/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Прогресс Run приходит через SSE (05_API.md §4). Любая буферизация превращает
        # поток событий в один ответ в конце расчёта, поэтому она выключена, а таймаут
        # чтения покрывает длительный sweep.
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header Connection "";
        chunked_transfer_encoding off;
        proxy_read_timeout 3600s;
    }

    # Примеры сценариев лежат рядом с приложением: `/scenarios/` отдаёт список файлов
    # каталога в JSON, `/scenarios/<имя>` — сам файл. Списка примеров в API нет, а зашивать
    # имена файлов во фронтенд нельзя (14_SCREENS.md §1.2), поэтому источник — каталог.
    location /scenarios/ {
        autoindex on;
        autoindex_format json;
        autoindex_exact_size off;
    }

    # Файлы сборки лежат под хэшем в имени и не меняются: их можно кэшировать надолго.
    location /bundle/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA: неизвестные пути отдаёт index.html, маршрутизация живёт в браузере.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
