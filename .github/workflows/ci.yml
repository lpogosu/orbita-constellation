name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: ${{ matrix.package }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: [core, api, worker]

    # Интеграционные тесты api идут на живой базе; без неё они помечались бы skip и
    # миграции проверялись бы только руками.
    services:
      postgres:
        image: postgres:16.15-alpine
        env:
          POSTGRES_USER: orbita
          POSTGRES_PASSWORD: orbita
          POSTGRES_DB: orbita
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U orbita -d orbita"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # orbita-core ставится из исходников: api и worker зависят от него, но в индексе
      # пакета нет.
      - name: Установить пакеты
        run: pip install -e "./core[dev]" -e "./api[dev]" -e "./worker[dev]"

      - name: ruff
        working-directory: ${{ matrix.package }}
        run: ruff check .

      - name: mypy --strict
        working-directory: ${{ matrix.package }}
        run: mypy

      # MinIO и Memgraph запускаются шагом, а не сервисом workflow: сервису нельзя
      # задать команду запуска, а обоим образам она нужна.
      - name: Поднять MinIO и Memgraph
        if: matrix.package == 'api'
        run: |
          docker run -d --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER=orbita -e MINIO_ROOT_PASSWORD=orbita-secret \
            quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z server /data
          docker run -d --name memgraph -p 7687:7687 \
            memgraph/memgraph-mage:3.13.0 --log-level=WARNING --telemetry-enabled=false

      # Открытый порт ещё не означает готовности: Memgraph принимает соединение раньше,
      # чем начинает отвечать на Bolt. Ждём ответа теми же клиентами, что и адаптеры.
      - name: Дождаться готовности MinIO и Memgraph
        if: matrix.package == 'api'
        run: |
          python - <<'PY'
          import time

          import boto3
          from neo4j import GraphDatabase

          DEADLINE = time.monotonic() + 120


          def wait(name, check):
              while True:
                  try:
                      check()
                      return
                  except Exception as error:
                      if time.monotonic() > DEADLINE:
                          raise SystemExit(f"{name} не поднялся: {error}") from error
                      time.sleep(2)


          s3 = boto3.client(
              "s3",
              endpoint_url="http://localhost:9000",
              aws_access_key_id="orbita",
              aws_secret_access_key="orbita-secret",
              region_name="us-east-1",
          )
          wait("MinIO", s3.list_buckets)
          driver = GraphDatabase.driver("bolt://localhost:7687", auth=None)
          wait("Memgraph", driver.verify_connectivity)
          driver.close()
          PY

      - name: pytest
        working-directory: ${{ matrix.package }}
        env:
          ORBITA_TEST_DATABASE_URL: postgresql://orbita:orbita@localhost:5432/orbita
          ORBITA_TEST_MINIO_ENDPOINT: http://localhost:9000
          ORBITA_TEST_MINIO_ACCESS_KEY: orbita
          ORBITA_TEST_MINIO_SECRET_KEY: orbita-secret
          ORBITA_TEST_MEMGRAPH_URI: bolt://localhost:7687
        run: pytest -q

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Ошибка в compose обнаруживается здесь, а не при первом `make up` на защите.
      - name: Проверить конфигурацию compose
        run: |
          docker compose -f deploy/docker-compose.yml config --quiet
          docker compose -f deploy/docker-compose.yml -f deploy/compose.degraded.yml config --quiet
