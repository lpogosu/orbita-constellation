[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "orbita-core"
version = "0.1.0"
description = "Расчётное ядро ОРБИТЫ: геометрия, временной граф, маршрутизация, метрики"
requires-python = ">=3.11"
dependencies = ["numpy>=2.1"]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "hypothesis>=6.112",
  # Независимый оракул графовых алгоритмов в property-тестах маршрутизации. В ядро не
  # входит: расчёт обязан работать на чистом Python и NumPy.
  "networkx>=3.3",
  "ruff>=0.14",
  "mypy>=1.18",
]

[tool.hatch.build.targets.wheel]
packages = ["orbita_core"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "RUF", "ANN", "TID"]
# Комментарии и docstring на русском (ADR-016), поэтому правила о «неоднозначных»
# кириллических буквах отключены: иначе они срабатывают на каждой строке текста.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.mypy]
# Версия интерпретатора не фиксируется: проверка идёт под тем Python, которым проект
# запускают (3.11 локально, 3.12 в образе), и должна проходить под обоими.
strict = true
files = ["orbita_core", "tests"]

# NetworkX не поставляет `py.typed`, а писать заглушки ради оракула в тестах незачем.
[[tool.mypy.overrides]]
module = "networkx.*"
ignore_missing_imports = true
