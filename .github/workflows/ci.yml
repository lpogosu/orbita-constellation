name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: ${{ matrix.package }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: [core, api, worker]

    # Интеграционные тесты идут на живых хранилищах: локально их поднимает
    # testcontainers, здесь - сервисы workflow. Без них тесты помечают себя skip, и
    # зелёный CI ничего не доказывал бы.
    services:
      postgres:
        image: postgres:16.15-alpine
        env:
          POSTGRES_USER: orbita
          POSTGRES_PASSWORD: orbita
          POSTGRES_DB: orbita
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U orbita -d orbita"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7.4.11-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # orbita-core ставится из исходников: api и worker зависят от него, но в индексе
      # пакета нет.
      - name: Установить пакеты
        run: pip install -e "./core[dev]" -e "./api[dev]" -e "./worker[dev]"

      - name: ruff
        working-directory: ${{ matrix.package }}
        run: ruff check .

      - name: mypy --strict
        working-directory: ${{ matrix.package }}
        run: mypy

      - name: pytest
        working-directory: ${{ matrix.package }}
        env:
          ORBITA_TEST_DATABASE_URL: postgresql://orbita:orbita@localhost:5432/orbita
          ORBITA_TEST_REDIS_URL: redis://localhost:6379/0
        run: pytest -q

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Ошибка в compose обнаруживается здесь, а не при первом `make up` на защите.
      - name: Проверить конфигурацию compose
        run: |
          docker compose -f deploy/docker-compose.yml config --quiet
          docker compose -f deploy/docker-compose.yml -f deploy/compose.degraded.yml config --quiet
