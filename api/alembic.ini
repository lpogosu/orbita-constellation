; Конфигурация Alembic. Пути заданы через %(here)s, поэтому `alembic upgrade head`
; работает из любой рабочей папки: и локально из корня репозитория, и в контейнере.
; Адрес базы намеренно пуст: его берёт env.py из ORBITA_POSTGRES_DSN, чтобы миграции и
; приложение не могли уехать на разные базы.

[alembic]
script_location = %(here)s/orbita_api/db/migrations
prepend_sys_path = %(here)s
path_separator = os
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
