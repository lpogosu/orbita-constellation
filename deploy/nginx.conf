server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Фронтенд и api видны браузеру на одном origin: страницам не нужен CORS,
    # а адрес api не попадает в сборку.
    location /api/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Прогресс Run приходит через SSE (05_API.md §4). Любая буферизация превращает
        # поток событий в один ответ в конце расчёта, поэтому она выключена, а таймаут
        # чтения покрывает длительный sweep.
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header Connection "";
        chunked_transfer_encoding off;
        proxy_read_timeout 3600s;
    }

    # SPA: неизвестные пути отдаёт index.html, маршрутизация живёт в браузере.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
