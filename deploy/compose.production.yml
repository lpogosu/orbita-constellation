# Public single-server deployment.  The base compose file deliberately exposes
# ports convenient for local development; this override leaves only the web
# reverse proxy reachable from the Internet.  Add a TLS proxy after a domain is
# available, or replace `80:80` with the proxy's upstream binding.

services:
  web:
    ports: !reset []

  gateway:
    image: nginx:1.31.5-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.gateway.conf:/etc/nginx/conf.d/default.conf:ro
      - /opt/orbita/cert:/etc/nginx/certs:ro
    depends_on:
      web:
        condition: service_healthy

  api:
    ports: !reset []

  postgres:
    ports: !reset []

  redis:
    ports: !reset []

  memgraph:
    ports: !reset []

  minio:
    ports: !reset []
